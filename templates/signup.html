{% extends "auth_base.html" %}
{% block title %}Sign Up &middot; PLV Lost and Found{% endblock %}

{% block content %}
<h4 class="text-center mb-4">Sign Up</h4>

<form method="post">
  <div class="mb-3">
    <label class="form-label" for="username">Username</label>
    <input class="form-control" id="username" name="username" required autofocus>
  </div>
  <div class="mb-3">
    <label class="form-label" for="email">Email</label>
    <input class="form-control" id="email" name="email" type="email" required>
  </div>
  <div class="mb-3">
    <label class="form-label" for="role">I am a</label>
    <select class="form-select" id="role" name="role">
      <option>Student</option>
      <option>Faculty</option>
    </select>
  </div>
  <div class="mb-4">
    <label class="form-label" for="password">Password</label>
    <input class="form-control" id="password" name="password" type="password" required>
  </div>
  <button class="btn btn-primary w-100">Sign Up</button>
</form>

<p class="text-center mt-3 mb-0">
  Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
</p>
{% endblock %}
