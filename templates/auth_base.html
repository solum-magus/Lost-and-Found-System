{% extends "base.html" %}

{# Centered card with no sidebar, used by the login and signup pages #}
{% block body %}
<div class="auth-wrap">
  <div class="card auth-card shadow">
    <div class="card-body p-4">

      <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='PLV.png') }}" alt="PLV logo" height="80"
             class="d-block mx-auto mb-2" onerror="this.style.display='none'">
        <div class="fw-semibold">PLV Lost and Found</div>
      </div>

      {% include "partials/flashes.html" %}
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
